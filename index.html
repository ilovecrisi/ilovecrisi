<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@ilovecrisi</title>

  <meta name="description" content="Perfil de ilovecrisi.">
  <meta name="theme-color" content="#050a14">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ilovecrisi">
  <meta property="og:description" content="Perfil de ilovecrisi.">
  <meta property="og:url" content="https://USUARIO.github.io/REPO/">
  <meta property="og:image" content="https://USUARIO.github.io/REPO/preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5 59 32 32 59 5 32Z' fill='none' stroke='%232d8cff' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%232d8cff'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div id="fondo-imagen"></div>
  <div class="tinte"></div>
  <canvas id="particulas"></canvas>

  <main class="ventana">
    <div class="barra">
      <span class="punto activo"></span>
      <span class="punto"></span>
      <span class="punto"></span>
      <span class="ruta">~/PROFILES/ilovecrisi.TXT</span>
      <span class="online">ONLINE</span>
    </div>

    <div class="contenido">
      <div class="principal">
        <div class="izquierda">
          <div class="encabezado">
            <div class="avatar">
              <video src="avatar.mp4" autoplay muted loop playsinline></video>
            </div>
            <h1>ilovecrisi</h1>
          </div>
        </div>
      </div>

      <p class="desc">In a world full of limits...choose to be limitless</p> 
      <p class="desc">If I play, I play to win</p> 
      <p class="desc">If you don't risk it, you don't deserve it.</p>
      <div class="reproductor" id="reproductor">
        <button class="play" id="play" title="Reproducir / pausar">&#9654;</button>

        <div class="info">
          <div class="titulo-cancion">
            <b>Star Shopping</b>
            <small></small>
          </div>
          <div class="progreso-fila">
            <span id="tiempo-actual">0:00</span>
            <input type="range" id="progreso" min="0" max="100" step="0.1" value="0">
            <span id="tiempo-total">0:33</span>
          </div>
        </div>

        <div class="ecualizador"><i></i><i></i><i></i><i></i><i></i></div>

        <div class="volumen">
          <button id="mute" title="Silenciar">&#128266;</button>
          <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.25">
        </div>
      </div>

      <div class="pie">
        <a class="enlace" href="https://discord.gg/dwmt" target="_blank" rel="noopener">
          <img src="https://cdn.simpleicons.org/discord/white" alt="">
          <span><b>Discord</b><small>/dwmt</small></span>
        </a>
        <a class="enlace" href="https://www.instagram.com/pfaceboy" target="_blank" rel="noopener">
          <img src="https://cdn.simpleicons.org/instagram/white" alt="">
          <span><b>Instagram</b><small>pfaceboy</small></span>
        </a>

        <div class="estado" id="discord-estado">
          <i class="punto-estado"></i>
          <span><b id="discord-texto">---</b><small id="discord-detalle">---</small></span>
        </div>

        <div class="visitas">VISITS: <b id="visitas">----</b></div>
      </div>
    </div>
  </main>

  <audio id="musica" src="musica.mp3" loop></audio>

  <script src="https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
